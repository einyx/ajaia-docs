apiVersion: apps/v1
kind: Deployment
metadata:
  name: ajaia-docs
  labels:
    app.kubernetes.io/name: ajaia-docs
spec:
  # One replica: the app stores state in a local SQLite file on the volume.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ajaia-docs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ajaia-docs
    spec:
      containers:
        - name: app
          image: ajaia-docs:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: PORT
              value: "8787"
            - name: AJAIA_DB
              value: /data/ajaia.db
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ajaia-docs-data
